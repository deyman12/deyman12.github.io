<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deyman12 / Lab</title>
    <meta
      name="description"
      content="A secondary GitHub workspace for experiments, forks, research, archives, backups, and things worth keeping."
    />
    <meta name="author" content="deyman12" />
    <meta
      name="theme-color"
      content="#0a0b0d"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f5f4f0"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") {
            document.documentElement.classList.add(t);
          } else {
            document.documentElement.classList.add(
              matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light",
            );
          }
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="deyman12 / Lab" />
    <meta property="og:title" content="deyman12 / Lab" />
    <meta
      property="og:description"
      content="A secondary GitHub workspace for experiments, forks, research, archives, backups, and things worth keeping."
